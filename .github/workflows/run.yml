name: Run Discord Custom Activity

on:
  schedule:
    # يعمل تلقائياً كل 5 دقائق لضمان عدم توقفه
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run Script
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: node index.js
